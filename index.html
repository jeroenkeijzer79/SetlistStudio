<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeroen & Irene - Setlist Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
html,body{margin:0;} img{max-width:100%;} [hidden]{display:none!important;}

  /*
    Palette lifted from jeroenirene.nl: near-black stage backdrop, warm
    charcoal panels, white type, and the site's signature coral-orange
    accent (sampled from its flower mark, #f4673b). Committed dark —
    the source site has no light variant, so this page doesn't either.
  */
  :root{
    --bg:#161616;
    --surface:#232323;
    --surface-2:#2d2b29;
    --border:#413e3a;
    --text:#f5f3f0;
    --text-muted:#a89f96;
    --accent:#f4673b;
    --accent-strong:#d1502b;
    --accent-contrast:#20120a;
    --danger:#ff6a6a;
    --danger-contrast:#2a1211;
    --success:#6fbf82;
    --warn:#e8b23d;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 18px rgba(0,0,0,.4);
    --radius:10px;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    padding-inline:16px;
    padding-block:20px 40px;
  }
  h1,h2,h3{font-family:"Poppins","Inter",sans-serif; text-wrap:balance; margin:0;}
  button{font-family:inherit;}
  input,button{font-size:15px;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}

  .app{display:flex; flex-direction:column; gap:18px;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 20px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .topbar::before{
    content:""; position:absolute; left:0; right:0; bottom:0; height:3px;
    background:var(--accent);
  }
  .topbar-flourish{color:var(--accent); font-size:1.1rem; margin-left:2px;}
  .topbar-title{display:flex; align-items:center; gap:14px;}
  .topbar-icon{
    display:flex; align-items:center; justify-content:center; width:44px; height:44px;
    border-radius:50%; background:var(--accent); color:var(--accent-contrast); flex:none;
  }
  .topbar-icon svg{width:22px; height:22px;}
  .topbar h1{font-size:1.5rem; font-weight:700;}
  .topbar-sub{margin:2px 0 0; color:var(--text-muted); font-size:.9rem;}
  .topbar-stats{display:flex; gap:8px; flex-wrap:wrap;}
  .stat-chip{
    background:var(--surface-2); border:1px solid var(--border); border-radius:999px;
    padding:6px 14px; font-size:.85rem; font-weight:600; color:var(--text-muted);
  }

  .settings-panel{
    border-radius:var(--radius); padding:16px 20px; border:1px solid var(--border);
    background:var(--surface); box-shadow:var(--shadow);
  }
  .settings-body{display:flex; flex-direction:column; gap:10px; max-width:560px;}
  .settings-body p{margin:0; color:var(--text-muted); font-size:.88rem; line-height:1.5;}
  .settings-status{color:var(--success); font-weight:600;}
  .settings-help{font-size:.85rem; color:var(--text-muted);}
  .settings-help summary{cursor:pointer; color:var(--accent); font-weight:600;}
  .settings-help ol{margin:8px 0 0; padding-left:18px; display:flex; flex-direction:column; gap:4px;}
  .settings-help code{background:var(--surface-2); padding:1px 5px; border-radius:4px; font-family:"IBM Plex Mono",monospace; font-size:.82rem;}
  #firebase-config-input{font-family:"IBM Plex Mono",monospace; font-size:.8rem; resize:vertical;}

  .banner{
    border-radius:var(--radius); padding:12px 16px; font-size:.9rem; font-weight:500;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    display:flex; align-items:center; gap:10px;
  }
  .banner.warn{ border-color:var(--warn); color:var(--warn); background:color-mix(in srgb, var(--warn) 12%, var(--surface)); }
  .banner.success{ border-color:var(--success); color:var(--success); background:color-mix(in srgb, var(--success) 12%, var(--surface)); }
  .banner.danger{ border-color:var(--danger); color:var(--danger); background:color-mix(in srgb, var(--danger) 12%, var(--surface)); }

  .layout{
    display:grid;
    /* fr-based tracks scale proportionally as the window resizes;
       dragging a handle sets a new ratio (see resize JS below). */
    grid-template-columns: minmax(240px, var(--w-library, 1.75fr)) 14px minmax(240px, var(--w-setlists, 1.55fr)) 14px minmax(320px, 1fr);
    gap:0; align-items:start;
  }
  .resize-handle{
    display:flex; align-items:center; justify-content:center; align-self:stretch;
    cursor:col-resize; touch-action:none; border-radius:4px;
  }
  .resize-handle-bar{ width:3px; height:40px; border-radius:2px; background:var(--border); }
  .resize-handle:hover .resize-handle-bar, .resize-handle:focus-visible .resize-handle-bar{ background:var(--accent); }
  .resize-handle:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  @media (max-width: 980px){
    .layout{grid-template-columns:1fr;}
    .resize-handle{display:none;}
  }

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; gap:12px;
    min-height:0;
  }
  .panel-header{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
  .panel-header h2{font-size:1.05rem; font-weight:600;}

  .btn{
    display:inline-flex; align-items:center; gap:6px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); padding:8px 12px; font-weight:600; cursor:pointer;
    transition:filter .12s ease;
  }
  .btn svg{width:16px; height:16px; flex:none;}
  .btn:hover{filter:brightness(0.96);}
  .btn:focus-visible, .icon-btn:focus-visible, .input:focus-visible, input:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .btn-accent{background:var(--accent); border-color:var(--accent-strong); color:var(--accent-contrast);}
  .btn-accent:hover{filter:brightness(1.05);}
  .btn-accent:disabled{opacity:.45; cursor:not-allowed; filter:none;}
  .btn-ghost{background:transparent;}
  .btn-danger{background:var(--danger); border-color:var(--danger); color:var(--danger-contrast);}
  .btn-small{padding:6px 10px; font-size:.85rem;}

  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px;
    border-radius:7px; border:1px solid transparent; background:transparent; color:var(--text-muted);
    cursor:pointer; flex:none;
  }
  .icon-btn svg{width:16px; height:16px;}
  .icon-btn:hover{background:var(--surface-2); color:var(--text);}
  .icon-btn.danger:hover{background:color-mix(in srgb, var(--danger) 16%, transparent); color:var(--danger);}
  .icon-btn.confirming{background:var(--danger); color:var(--danger-contrast);}
  .icon-btn.quick-add:hover{background:color-mix(in srgb, var(--accent) 18%, transparent); color:var(--accent-strong);}

  .input{
    width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--text);
  }
  .input::placeholder{color:var(--text-muted);}

  .add-track-form{display:flex; gap:6px; flex-wrap:wrap;}
  .add-track-form .input{flex:1; min-width:120px;}

  .add-track-row{display:flex; gap:6px; align-items:center; margin:2px 0 4px;}
  .add-track-row select.input{flex:1; min-width:0; cursor:pointer;}
  .add-track-row select.input:disabled{opacity:.55; cursor:not-allowed;}
  .input-duration{width:80px; flex:none; min-width:80px;}
  .field-error{color:var(--danger); font-size:.82rem; margin:0;}
  .hint{color:var(--text-muted); font-size:.78rem; margin:-4px 0 0;}

  .library-list, .setlists-list{
    display:flex; flex-direction:column; gap:6px; overflow-y:auto; max-height:60vh; padding-right:2px;
  }

  .track-item{
    display:flex; align-items:center; gap:8px; padding:8px 8px 8px 4px;
    border:1px solid var(--border); border-radius:8px; background:var(--surface-2); cursor:grab;
  }
  .track-item:active{cursor:grabbing;}
  .track-item.dragging{opacity:.4;}
  .track-item.editing{cursor:default;}
  .track-edit-title{flex:1.3; min-width:0;}
  .track-edit-artist{flex:1; min-width:0;}
  .track-edit-duration{width:70px; flex:none;}
  .drag-handle{color:var(--text-muted); display:flex; flex:none;}
  .drag-handle svg{width:14px; height:18px;}
  .track-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
  .track-title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500;}
  .track-artist{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.76rem; color:var(--text-muted); font-weight:400;}
  .track-duration{color:var(--text-muted); font-size:.88rem; flex:none;}

  .empty-state{
    text-align:center; padding:26px 12px; color:var(--text-muted); font-size:.9rem;
    border:1px dashed var(--border); border-radius:8px;
  }
  .empty-state strong{display:block; color:var(--text); font-family:"Poppins",sans-serif; font-size:1.05rem; margin-bottom:4px; font-weight:600;}

  .setlist-row{
    display:flex; align-items:center; gap:10px; padding:10px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface-2); cursor:pointer; text-align:left;
  }
  .setlist-row.active{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface-2));}
  .setlist-rename-input{flex:1; min-width:0;}
  .status-dot{width:9px; height:9px; border-radius:50%; flex:none; background:var(--warn);}
  .status-dot.ok{background:var(--success);}
  .setlist-row-main{flex:1; min-width:0;}
  .setlist-row-name{display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .setlist-row-meta{display:block; color:var(--text-muted); font-size:.8rem;}

  .new-setlist-form{display:flex; gap:6px;}

  .editor-empty{
    display:flex; align-items:center; justify-content:center; min-height:280px; text-align:center;
    color:var(--text-muted); flex-direction:column; gap:6px;
  }

  .editor-header{display:flex; flex-direction:column; gap:10px;}
  #setlist-name-input{
    font-family:"Poppins",sans-serif; font-size:1.4rem; font-weight:700; border:1px solid transparent;
    background:transparent; color:var(--text); padding:4px 6px; border-radius:6px; width:100%;
  }
  #setlist-name-input:hover, #setlist-name-input:focus{border-color:var(--border); background:var(--surface-2);}

  .editor-stats{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .badge{
    display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px;
    font-size:.82rem; font-weight:700; border:1px solid var(--border); background:var(--surface-2);
  }
  .badge.ok{color:var(--success); border-color:var(--success);}
  .badge.warn{color:var(--warn); border-color:var(--warn);}
  .badge-duration{font-family:"IBM Plex Mono",monospace; font-size:.95rem;}

  .editor-actions{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto;}

  #setlist-track-list{
    display:flex; flex-direction:column; gap:6px; min-height:120px; padding:10px;
    border:1px dashed var(--border); border-radius:8px; background:var(--surface-2);
  }
  .setlist-track-item{
    display:flex; align-items:center; gap:10px; padding:8px; border-radius:8px;
    background:var(--surface); border:1px solid var(--border); cursor:grab;
  }
  .setlist-track-item:active{cursor:grabbing;}
  .setlist-track-item.dragging{opacity:.4;}
  .setlist-track-item.missing{border-style:dashed; color:var(--text-muted);}
  .track-position{width:22px; text-align:right; color:var(--text-muted); font-size:.85rem; flex:none;}
  .track-reorder{display:flex; flex-direction:column; flex:none;}
  .track-reorder .icon-btn{width:22px; height:18px;}
  .track-reorder svg{width:12px; height:12px;}
  .drop-indicator{height:3px; border-radius:2px; background:var(--accent); margin:0 4px;}
  .drop-hint{text-align:center; color:var(--text-muted); font-size:.85rem; padding:14px 6px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>


<div class="app">
  <header class="topbar">
    <div class="topbar-title">
      <span class="topbar-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </span>
      <div>
        <h1>Jeroen & Irene - Setlist Studio <span class="topbar-flourish" aria-hidden="true"></span></h1>
        <!-- <p class="topbar-sub">Bibliotheek opbouwen, setlists slepen, duur automatisch berekend</p> -->
      </div>
    </div>
    <div class="topbar-stats">
      <span id="stat-tracks" class="stat-chip">0 nummers</span>
      <span id="stat-setlists" class="stat-chip">0 setlists</span>
      <button type="button" class="icon-btn" id="settings-btn" aria-label="Cloud-synchronisatie instellen" title="Cloud-synchronisatie">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </button>
    </div>
  </header>

  <div id="settings-panel" class="settings-panel" hidden></div>

  <div id="banner" class="banner" hidden role="status"></div>

  <main class="layout">
    <section class="panel panel-library" aria-label="Bibliotheek" id="panel-library">
      <div class="panel-header">
        <h2>Bibliotheek</h2>
        <button type="button" class="btn btn-ghost" id="upload-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></svg>
          Bestand
        </button>
        <input type="file" id="file-input" accept=".csv,.txt,text/csv,text/plain" hidden>
      </div>
      <p class="hint">Kolommen: titel, duur(mm:ss), duur(sec), artiest (optioneel)</p>

      <input type="search" class="input" id="library-search" placeholder="Zoek nummer…" aria-label="Zoek in bibliotheek">

      <form id="add-track-form" class="add-track-form">
        <input type="text" class="input" id="new-track-title" placeholder="Titel" aria-label="Titel van nieuw nummer" required>
        <input type="text" class="input" id="new-track-artist" placeholder="Artiest (optioneel)" aria-label="Oorspronkelijke artiest">
        <input type="text" class="input input-duration mono" id="new-track-duration" placeholder="mm:ss" aria-label="Duur (mm:ss)" required>
        <button type="submit" class="btn btn-accent" aria-label="Nummer toevoegen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </form>
      <p class="field-error" id="add-track-error" hidden></p>

      <div class="library-list" id="library-list"></div>
    </section>

    <div class="resize-handle" id="resize-handle-library" role="separator" aria-orientation="vertical" aria-label="Breedte bibliotheek aanpassen" tabindex="0"><span class="resize-handle-bar"></span></div>

    <section class="panel panel-setlists" aria-label="Setlists" id="panel-setlists">
      <div class="panel-header">
        <h2>Setlists</h2>
        <button type="button" class="btn btn-accent btn-small" id="new-setlist-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Nieuw
        </button>
      </div>
      <div id="new-setlist-form-slot"></div>
      <div class="setlists-list" id="setlists-list"></div>
    </section>

    <div class="resize-handle" id="resize-handle-setlists" role="separator" aria-orientation="vertical" aria-label="Breedte setlists aanpassen" tabindex="0"><span class="resize-handle-bar"></span></div>

    <section class="panel panel-editor" aria-label="Actieve setlist" id="editor-panel"></section>
  </main>
</div>

<script>
(function(){
  "use strict";

  // ---------- helpers ----------
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function plural(n, sing, plur){ return n === 1 ? sing : plur; }
  function parseDuration(raw){
    if (raw == null) return null;
    var str = String(raw).trim();
    if (!str) return null;
    if (/^\d+$/.test(str)) return parseInt(str, 10);
    var parts = str.split(":");
    if (parts.length < 2 || parts.length > 3) return null;
    for (var i=0;i<parts.length;i++){ if(!/^\d{1,2}$/.test(parts[i].trim())) return null; }
    var secs = 0;
    for (var j=0;j<parts.length;j++){ secs = secs*60 + parseInt(parts[j],10); }
    return secs;
  }
  function formatDuration(totalSec){
    totalSec = Math.max(0, Math.round(totalSec || 0));
    var h = Math.floor(totalSec/3600);
    var m = Math.floor((totalSec%3600)/60);
    var s = totalSec%60;
    if (h>0) return h + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
    return m + ":" + String(s).padStart(2,"0");
  }
  function csvEscape(v){
    v = String(v);
    if (/[";\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
    return v;
  }
  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }
  var ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
  var ICON_PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
  var ICON_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  var ICON_HANDLE = '<svg viewBox="0 0 8 20" fill="currentColor"><circle cx="2" cy="3" r="1.4"/><circle cx="6" cy="3" r="1.4"/><circle cx="2" cy="10" r="1.4"/><circle cx="6" cy="10" r="1.4"/><circle cx="2" cy="17" r="1.4"/><circle cx="6" cy="17" r="1.4"/></svg>';
  var ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>';
  var ICON_DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  var ICON_DOWNLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';
  var ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  // ---------- state ----------
  var tracksMap = new Map();
  var setlistsMap = new Map();
  var activeSetlistId = null;
  var db = null;
  var usingDb = false;
  var localStorageOk = false;
  var STORAGE_KEY_TRACKS = "setlist-studio:tracks";
  var STORAGE_KEY_SETLISTS = "setlist-studio:setlists";
  var FIREBASE_CONFIG_KEY = "setlist-studio:firebase-config";
  var PENDING_MIGRATION_KEY = "setlist-studio:pending-migration";
  // Baked-in project so cloud sync works for every visitor out of the box,

  function resolveFirebaseConfig(){
    var raw = null;
    try{ raw = window.localStorage.getItem(FIREBASE_CONFIG_KEY); } catch(e){ /* ignore */ }
    if (raw === "disabled"){ firebaseConfigSource = null; return null; }
    if (raw){
      try{
        var obj = JSON.parse(raw);
        if (obj && obj.apiKey && obj.projectId){ firebaseConfigSource = "custom"; return obj; }
      } catch(e){ /* ignore, fall through to default */ }
    }
    if (DEFAULT_FIREBASE_CONFIG){ firebaseConfigSource = "default"; return DEFAULT_FIREBASE_CONFIG; }
    firebaseConfigSource = null;

  // Accepts either the raw `const firebaseConfig = {...};` snippet Firebase

  function parseFirebaseConfigInput(text){
    var match = String(text || "").match(/\{[\s\S]*\}/);
    if (!match) return null;
    var objText = match[0];
    try{
      var obj = new Function("return (" + objText + ");")();
      if (obj && typeof obj === "object" && obj.apiKey && obj.projectId) return obj;
    } catch(e){ /* fall through to strict JSON */ }
    try{
      var asJson = JSON.parse(objText);
      if (asJson && asJson.apiKey && asJson.projectId) return asJson;
    } catch(e){ /* ignore */ }
    return null;
  }

  function handleConnectFirebase(){

  function loadScript(src){
    return new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = function(){ reject(new Error("kon " + src + " niet laden")); };
      document.head.appendChild(s);
    });
  }
  var firebaseSdkLoadPromise = null;
  function loadFirebaseSdk(){
    if (window.firebase && window.firebase.firestore) return Promise.resolve();
    if (firebaseSdkLoadPromise) return firebaseSdkLoadPromise;
    var FB_VERSION = "10.13.2";
    firebaseSdkLoadPromise = loadScript("https://www.gstatic.com/firebasejs/" + FB_VERSION + "/firebase-app-compat.js")
      .then(function(){ return loadScript("https://www.gstatic.com/firebasejs/" + FB_VERSION + "/firebase-firestore-compat.js"); })
      .catch(function(e){ firebaseSdkLoadPromise = null; throw e; });
    return firebaseSdkLoadPromise;
  }
  async function initFirebase(config){
    await loadFirebaseSdk();
    if (!window.firebase || !window.firebase.firestore) throw new Error("Firebase SDK niet beschikbaar.");
    var app;
    try{ app = window.firebase.initializeApp(config); }
    catch(e){ app = window.firebase.initializeApp(config, "setlist-studio-" + Date.now()); }
    return window.firebase.firestore(app);

  function subscribeRemote(){
    db.collection("tracks").onSnapshot(function(snap){
      tracksMap.clear();
      snap.docs.forEach(function(d){ tracksMap.set(d.id, Object.assign({id:d.id}, d.data())); });
      renderLibrary(); renderSetlistsList(); renderActiveSetlist(); renderStats();
    }, function(){ showBanner("De bibliotheek kon niet worden geladen. Probeer de pagina te vernieuwen.", "warn"); });

    db.collection("setlists").onSnapshot(function(snap){
      setlistsMap.clear();
      snap.docs.forEach(function(d){ setlistsMap.set(d.id, Object.assign({id:d.id}, d.data())); });
      if (activeSetlistId && !setlistsMap.has(activeSetlistId)) activeSetlistId = null;
      renderSetlistsList(); renderActiveSetlist(); renderStats();
    }, function(){ showBanner("De setlists konden niet worden geladen. Probeer de pagina te vernieuwen.", "warn"); });
  }

  // One-time handoff: local data present before connecting cloud sync is
  // uploaded (with its original ids, so setlist track references stay
  // valid) rather than silently left behind.
  function maybeMigratePendingData(){
    var raw;
    try{ raw = window.sessionStorage.getItem(PENDING_MIGRATION_KEY); } catch(e){ raw = null; }
    if (!raw) return;
    try{ window.sessionStorage.removeItem(PENDING_MIGRATION_KEY); } catch(e){ /* ignore */ }
    var pending;
    try{ pending = JSON.parse(raw); } catch(e){ return; }
    if (!pending) return;
    var tasks = [];
    (pending.tracks || []).forEach(function(t){
      var data = Object.assign({}, t); delete data.id;
      tasks.push(db.collection("tracks").doc(t.id).set(data));
    });
    (pending.setlists || []).forEach(function(s){
      var data = Object.assign({}, s); delete data.id;
      tasks.push(db.collection("setlists").doc(s.id).set(data));
    });
    if (!tasks.length) return;
    Promise.all(tasks).then(function(){
      showBanner("Lokale nummers en setlists zijn meegenomen naar de cloud-synchronisatie.", "success");
    }).catch(function(){
      showBanner("Niet alle lokale gegevens konden worden meegenomen naar de cloud.", "warn");
    });
  }

  async function initStore(){
    // 1. The Claude artifact's own shared storage, when this page is
    //    running inside Claude.
    try{
      db = (window.claude && window.claude.use) ? await window.claude.use("db") : null;
    } catch(e){ db = null; }
    if (db){
      usingDb = true; storeMode = "claude";
      subscribeRemote();
      renderSettingsPanel();
      return;
    }

    // 2. A Firebase project — either the site's built-in default (so cloud
    //    sync works for every visitor automatically) or a per-device custom
    //    override — for sharing/collaboration when hosted outside Claude
    //    (e.g. GitHub Pages). See the settings panel (gear icon).
    var fbConfig = resolveFirebaseConfig();
    if (fbConfig){
      try{
        db = await initFirebase(fbConfig);
        usingDb = true; storeMode = "cloud";
        subscribeRemote();
        maybeMigratePendingData();
        renderSettingsPanel();
        return;
      } catch(e){
        showBanner("Kon niet verbinden met cloud-synchronisatie (" + (e && e.message ? e.message : "onbekende fout") + "). Tijdelijk teruggevallen op lokale opslag.", "warn");
      }
    }

    // 3. Local browser storage, or in-memory only as a last resort.
    usingDb = false;
    localStorageOk = probeLocalStorage();
    if (localStorageOk){
      loadLocal();
      storeMode = "local";
      showBanner("Nummers en setlists worden lokaal in deze browser bewaard (niet gedeeld). Wil je samenwerken? Verbind cloud-synchronisatie via het instellingen-icoon rechtsboven.");
    } else {
      storeMode = "memory";
      showBanner("Opslag is niet beschikbaar — wijzigingen worden niet bewaard na het sluiten van deze pagina.", "warn");
    }
    renderLibrary(); renderSetlistsList(); renderActiveSetlist(); renderStats();
    renderSettingsPanel();
  }

  async function addTrack(title, artist, durationSec){
    var data = {title: title, artist: artist || "", durationSec: durationSec, addedAt: Date.now()};
    if (usingDb){
      await db.collection("tracks").add(data);
    } else {
      var id = uid();
      tracksMap.set(id, Object.assign({id:id}, data));
      persistLocal();
      renderLibrary(); renderActiveSetlist(); renderSetlistsList(); renderStats();
    }
  }

  async function updateTrack(id, title, artist, durationSec){
    if (usingDb){
      await db.collection("tracks").doc(id).update({title: title, artist: artist || "", durationSec: durationSec});
    } else {
      var t = tracksMap.get(id);
      if (t){
        t.title = title; t.artist = artist || ""; t.durationSec = durationSec;
        persistLocal();
        renderLibrary(); renderActiveSetlist(); renderSetlistsList();
      }
    }
  }

  async function deleteTrackById(id){
    if (usingDb){
      await db.collection("tracks").doc(id).delete();
      var entries = Array.from(setlistsMap.entries());
      for (var i=0;i<entries.length;i++){
        var sid = entries[i][0], sl = entries[i][1];
        if (sl.trackIds.indexOf(id) !== -1){
          var newIds = sl.trackIds.filter(function(t){ return t !== id; });
          await db.collection("setlists").doc(sid).update({trackIds:newIds, updatedAt:Date.now()});
        }
      }
    } else {
      tracksMap.delete(id);
      setlistsMap.forEach(function(sl){
        if (sl.trackIds.indexOf(id) !== -1){
          sl.trackIds = sl.trackIds.filter(function(t){ return t !== id; });
          sl.updatedAt = Date.now();
        }
      });
      persistLocal();
      renderLibrary(); renderSetlistsList(); renderActiveSetlist(); renderStats();
    }
  }

  async function createSetlist(name){
    var data = {name: name, trackIds: [], createdAt: Date.now(), updatedAt: Date.now()};
    if (usingDb){
      var ref = await db.collection("setlists").add(data);
      activeSetlistId = ref.id;
      renderActiveSetlist();
    } else {
      var id = uid();
      setlistsMap.set(id, Object.assign({id:id}, data));
      activeSetlistId = id;
      persistLocal();
      renderSetlistsList(); renderActiveSetlist(); renderStats();
    }
  }

  async function renameSetlist(id, name){
    if (usingDb){
      await db.collection("setlists").doc(id).update({name:name, updatedAt:Date.now()});
    } else {
      var sl = setlistsMap.get(id);
      if (sl){ sl.name = name; sl.updatedAt = Date.now(); persistLocal(); renderSetlistsList(); }
    }
  }

  async function deleteSetlist(id){
    if (usingDb){
      await db.collection("setlists").doc(id).delete();
    } else {
      setlistsMap.delete(id);
      persistLocal();
    }
    if (activeSetlistId === id) activeSetlistId = null;
    if (!usingDb){ renderSetlistsList(); renderActiveSetlist(); renderStats(); }
  }

  async function mutateSetlist(id, updater){
    var sl = setlistsMap.get(id);
    if (!sl) return;
    var newIds = updater(sl.trackIds.slice());
    if (usingDb){
      await db.collection("setlists").doc(id).update({trackIds:newIds, updatedAt:Date.now()});
    } else {
      sl.trackIds = newIds; sl.updatedAt = Date.now();
      persistLocal();
      renderSetlistsList(); renderActiveSetlist();
    }
  }

  // ---------- CSV import/export ----------
  // Expected columns: titel, duur(mm:ss), duur(sec) — comma- or semicolon-separated.
  // duur(sec) wins when present and numeric; duur(mm:ss) is the fallback.
  function parseCsvLine(line, delim){
    var result = [];
    var cur = "";
    var inQuotes = false;
    for (var i=0;i<line.length;i++){
      var ch = line[i];
      if (inQuotes){
        if (ch === '"'){
          if (line[i+1] === '"'){ cur += '"'; i++; }
          else inQuotes = false;
        } else cur += ch;
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === delim){ result.push(cur); cur = ""; }
        else cur += ch;
      }
    }
    result.push(cur);
    return result;
  }
  function detectDelimiter(sampleLine){
    var commas = (sampleLine.match(/,/g)||[]).length;
    var semis = (sampleLine.match(/;/g)||[]).length;
    return semis > commas ? ";" : ",";
  }
  function importCsvText(text){
    var lines = text.split(/\r\n|\n|\r/).filter(function(l){ return l.trim() !== ""; });
    if (lines.length === 0) return {rows:[], added:0, skipped:0};
    var delim = detectDelimiter(lines[0]);
    var rows = [];
    var added = 0, skipped = 0;
    lines.forEach(function(line, idx){
      var fields = parseCsvLine(line, delim);
      var title = (fields[0]||"").trim().replace(/^["']|["']$/g, "");
      var mmss = (fields[1]||"").trim().replace(/^["']|["']$/g, "");
      var secField = (fields[2]||"").trim().replace(/^["']|["']$/g, "");
      var artist = (fields[3]||"").trim().replace(/^["']|["']$/g, "");
      if (idx === 0 && /^titel$|^title$/i.test(title)) return; // header row, ignore silently
      var durationSec = null;
      if (secField && /^\d+$/.test(secField)) durationSec = parseInt(secField, 10);
      else if (mmss) durationSec = parseDuration(mmss);
      if (!title || durationSec == null || durationSec <= 0){ skipped++; return; }
      added++;
      rows.push({title:title, artist:artist, durationSec:durationSec});
    });
    return {rows: rows, added: added, skipped: skipped};
  }

  async function handleFileImport(file){
    var text = await file.text();
    var result = importCsvText(text);
    if (result.rows.length === 0){
      showBanner("Geen geldige regels gevonden. Verwachte kolommen: titel, duur(mm:ss), duur(sec) — gescheiden door komma of puntkomma.", "warn");
      return;
    }
    showBanner("Bezig met importeren…");
    for (var i=0;i<result.rows.length;i++){
      await addTrack(result.rows[i].title, result.rows[i].artist, result.rows[i].durationSec);
    }
    var msg = result.added + " " + plural(result.added,"nummer","nummers") + " toegevoegd";
    if (result.skipped > 0) msg += ", " + result.skipped + " " + plural(result.skipped,"regel","regels") + " overgeslagen (onherkenbaar formaat)";
    showBanner(msg + ".", "success");
  }

  function buildSetlistCsv(sl){
    var rows = [["#","Titel","Artiest","Duur (mm:ss)"]];
    var total = 0;
    sl.trackIds.forEach(function(tid, i){
      var t = tracksMap.get(tid);
      var title = t ? t.title : "(verwijderd nummer)";
      var artist = t ? (t.artist || "") : "";
      var dur = t ? t.durationSec : 0;
      total += dur;
      rows.push([String(i+1), title, artist, formatDuration(dur)]);
    });
    rows.push(["", "Totale duur", "", formatDuration(total)]);
    return "﻿" + rows.map(function(r){ return r.map(csvEscape).join(";"); }).join("\r\n");
  }

  // Plain-browser fallback (works on a normal host like GitHub Pages;
  // inert inside the Claude artifact sandbox, where `downloads` is used instead).
  function downloadBlobViaBrowser(blob, filename){
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      return true;
    } catch(e){ return false; }
  }

  // Word export: a real, minimal .docx (Open XML) package built by hand
  // and zipped with JSZip (lazy-loaded from cdnjs, like jsPDF below).

  // downloads capability only allow-lists the real "docx" extension.

    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
    '</Types>';
  var DOCX_PACKAGE_RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    '</Relationships>';

    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '</Relationships>';
  var DOCX_STYLES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/></w:rPr></w:rPrDefault></w:docDefaults>' +
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>' +
    '<w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:after="80"/></w:pPr><w:rPr><w:b/><w:sz w:val="44"/></w:rPr></w:style>' +
    '<w:style w:type="paragraph" w:styleId="Subtle"><w:name w:val="Subtle"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:after="240"/></w:pPr><w:rPr><w:color w:val="666666"/><w:sz w:val="18"/></w:rPr></w:style>' +
    '</w:styles>';

  function buildSetlistDocumentXml(sl){
    var count = sl.trackIds.length;
    var total = 0;
    var rowsXml = "";
    sl.trackIds.forEach(function(tid, i){
      var t = tracksMap.get(tid);
      var title = t ? t.title : "(verwijderd nummer)";
      var artist = t ? (t.artist || "") : "";
      var dur = t ? t.durationSec : 0;
      total += dur;
      var titleRuns = '<w:r><w:t xml:space="preserve">' + escapeHtml(title) + '</w:t></w:r>';
      if (artist){
        titleRuns += '<w:r><w:br/></w:r><w:r><w:rPr><w:color w:val="666666"/><w:sz w:val="18"/></w:rPr><w:t xml:space="preserve">' + escapeHtml(artist) + '</w:t></w:r>';
      }
      rowsXml += '' +
        '<w:tr>' +
          '<w:tc><w:tcPr><w:tcW w:w="600" w:type="dxa"/></w:tcPr><w:p><w:r><w:t>' + (i+1) + '</w:t></w:r></w:p></w:tc>' +
          '<w:tc><w:tcPr><w:tcW w:w="6100" w:type="dxa"/></w:tcPr><w:p>' + titleRuns + '</w:p></w:tc>' +
          '<w:tc><w:tcPr><w:tcW w:w="1600" w:type="dxa"/></w:tcPr><w:p><w:r><w:t>' + escapeHtml(formatDuration(dur)) + '</w:t></w:r></w:p></w:tc>' +
        '</w:tr>';
    });
    var headerRow = '' +
      '<w:tr>' +
        '<w:tc><w:tcPr><w:tcW w:w="600" w:type="dxa"/><w:shd w:val="clear" w:fill="F0F0F0"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>#</w:t></w:r></w:p></w:tc>' +
        '<w:tc><w:tcPr><w:tcW w:w="6100" w:type="dxa"/><w:shd w:val="clear" w:fill="F0F0F0"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>Titel</w:t></w:r></w:p></w:tc>' +
        '<w:tc><w:tcPr><w:tcW w:w="1600" w:type="dxa"/><w:shd w:val="clear" w:fill="F0F0F0"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>Duur</w:t></w:r></w:p></w:tc>' +
      '</w:tr>';
    var totalRow = '' +
      '<w:tr>' +
        '<w:tc><w:tcPr><w:tcW w:w="600" w:type="dxa"/></w:tcPr><w:p/></w:tc>' +
        '<w:tc><w:tcPr><w:tcW w:w="6100" w:type="dxa"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>Totale duur</w:t></w:r></w:p></w:tc>' +
        '<w:tc><w:tcPr><w:tcW w:w="1600" w:type="dxa"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>' + escapeHtml(formatDuration(total)) + '</w:t></w:r></w:p></w:tc>' +
      '</w:tr>';
    var table = '' +
      '<w:tbl>' +
        '<w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders>' +
          '<w:top w:val="single" w:sz="4" w:color="999999"/><w:left w:val="single" w:sz="4" w:color="999999"/>' +
          '<w:bottom w:val="single" w:sz="4" w:color="999999"/><w:right w:val="single" w:sz="4" w:color="999999"/>' +
          '<w:insideH w:val="single" w:sz="4" w:color="999999"/><w:insideV w:val="single" w:sz="4" w:color="999999"/>' +
        '</w:tblBorders></w:tblPr>' +

        headerRow + rowsXml + totalRow +
      '</w:tbl>';
    var body = '' +
      '<w:p><w:pPr><w:pStyle w:val="Title"/></w:pPr><w:r><w:t xml:space="preserve">' + escapeHtml(sl.name) + '</w:t></w:r></w:p>' +
      '<w:p><w:pPr><w:pStyle w:val="Subtle"/></w:pPr><w:r><w:t xml:space="preserve">Jeroen &amp; Irene · Setlist Studio · ' + count + ' ' + plural(count,"nummer","nummers") + '</w:t></w:r></w:p>' +

  var jsZipLoadPromise = null;
  function loadJsZip(){
    if (window.JSZip) return Promise.resolve(window.JSZip);
    if (jsZipLoadPromise) return jsZipLoadPromise;
    jsZipLoadPromise = new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
      s.onload = function(){
        if (window.JSZip) resolve(window.JSZip);
        else reject(new Error("JSZip kon niet worden geïnitialiseerd."));
      };
      s.onerror = function(){ jsZipLoadPromise = null; reject(new Error("JSZip kon niet worden geladen.")); };
      document.head.appendChild(s);
    });
    return jsZipLoadPromise;
  }
  function buildSetlistDocxBlob(sl, JSZipCtor){
    var zip = new JSZipCtor();
    zip.file("[Content_Types].xml", DOCX_CONTENT_TYPES);
    zip.folder("_rels").file(".rels", DOCX_PACKAGE_RELS);
    var wordFolder = zip.folder("word");
    wordFolder.file("document.xml", buildSetlistDocumentXml(sl));
    wordFolder.file("styles.xml", DOCX_STYLES);
    wordFolder.folder("_rels").file("document.xml.rels", DOCX_DOCUMENT_RELS);
    return zip.generateAsync({
      type: "blob",
      mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    });
  }

  // PDF export: lazy-loads jsPDF from cdnjs on first use.
  var jsPdfLoadPromise = null;
  function loadJsPdf(){
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
    if (jsPdfLoadPromise) return jsPdfLoadPromise;
    jsPdfLoadPromise = new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js";
      s.onload = function(){
        if (window.jspdf && window.jspdf.jsPDF) resolve(window.jspdf.jsPDF);
        else reject(new Error("jsPDF kon niet worden geïnitialiseerd."));
      };
      s.onerror = function(){ jsPdfLoadPromise = null; reject(new Error("jsPDF kon niet worden geladen.")); };
      document.head.appendChild(s);
    });
    return jsPdfLoadPromise;
  }
  function buildSetlistPdfBlob(sl, jsPDFCtor){
    var doc = new jsPDFCtor({unit:"pt", format:"a4"});
    var pageWidth = doc.internal.pageSize.getWidth();
    var pageHeight = doc.internal.pageSize.getHeight();
    var marginX = 48;
    var y = 64;
    doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.setTextColor(20);
    doc.text(sl.name, marginX, y);
    y += 18;
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(120);
    doc.text("Jeroen & Irene - Setlist Studio", marginX, y);
    y += 22;
    doc.setDrawColor(210);
    doc.line(marginX, y, pageWidth - marginX, y);
    y += 22;

    var total = 0;
    sl.trackIds.forEach(function(tid, i){
      var t = tracksMap.get(tid);
      var title = t ? t.title : "(verwijderd nummer)";
      var artist = t ? (t.artist || "") : "";
      var dur = t ? t.durationSec : 0;
      total += dur;
      if (y > pageHeight - 80){ doc.addPage(); y = 64; }
      doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(25);
      doc.text((i+1) + ".", marginX, y);
      doc.text(title, marginX + 26, y);
      doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(25);
      doc.text(formatDuration(dur), pageWidth - marginX, y, {align:"right"});
      if (artist){
        y += 13;
        doc.setFontSize(9); doc.setTextColor(120);
        doc.text(artist, marginX + 26, y);
      }
      y += 20;
    });

    y += 6;
    doc.setDrawColor(30);
    doc.line(marginX, y, pageWidth - marginX, y);
    y += 20;
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(20);
    doc.text("Totale duur", marginX, y);
    doc.text(formatDuration(total), pageWidth - marginX, y, {align:"right"});

    return doc.output("blob");
  }

  function exportFormatLabel(format){
    return format === "pdf" ? "PDF" : format === "docx" ? "Word" : "CSV";
  }
  function buildExportPayload(sl, format){
    if (format === "docx"){
      return loadJsZip().then(function(JSZipCtor){
        return buildSetlistDocxBlob(sl, JSZipCtor).then(function(blob){
          return {blob: blob, ext: "docx"};
        });
      });
    }
    if (format === "pdf"){
      return loadJsPdf().then(function(jsPDFCtor){
        return {blob: buildSetlistPdfBlob(sl, jsPDFCtor), ext:"pdf"};
      });
    }
    return Promise.resolve({blob: new Blob([buildSetlistCsv(sl)], {type:"text/csv;charset=utf-8;"}), ext:"csv"});
  }

  async function exportSetlist(id, format){
    var sl = setlistsMap.get(id);
    if (!sl) return;
    if (sl.trackIds.length < 3){
      showBanner("Een setlist moet minstens 3 nummers bevatten voordat je kunt exporteren.", "warn");
      return;
    }
    var baseName = (sl.name || "setlist").replace(/[\\/:*?"<>|]+/g, "").trim() || "setlist";
    var payload;
    try{
      payload = await buildExportPayload(sl, format);
    } catch(e){
      showBanner("Exporteren als " + exportFormatLabel(format) + " is niet gelukt: " + (e && e.message ? e.message : "onbekende fout") + ".", "warn");
      return;
    }
    var filename = baseName + "." + payload.ext;

    try{
      var downloads = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
      if (downloads){
        await downloads.save({filename: filename, data: payload.blob});
        showBanner("“" + sl.name + "” is geëxporteerd als " + exportFormatLabel(format) + ".", "success");
        return;
      }
    } catch(e){
      if (e && e.code === "declined") return;
      // fall through to the plain-browser download below
    }
    if (downloadBlobViaBrowser(payload.blob, filename)){
      showBanner("“" + sl.name + "” is gedownload als " + exportFormatLabel(format) + ".", "success");
    } else {
      showBanner("Exporteren is niet gelukt. Probeer het opnieuw.", "warn");
    }
  }

  // ---------- drag & drop ----------
  function getDropIndex(container, clientY, excludeEl){
    var items = Array.prototype.slice.call(container.querySelectorAll(".setlist-track-item")).filter(function(el){ return el !== excludeEl; });
    for (var i=0;i<items.length;i++){
      var rect = items[i].getBoundingClientRect();
      var mid = rect.top + rect.height/2;
      if (clientY < mid) return i;
    }
    return items.length;
  }

  editorPanelEl.addEventListener("dragstart", function(e){
    var item = e.target.closest ? e.target.closest(".setlist-track-item") : null;
    if (!item) return;
    item.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("application/x-reorder-index", item.getAttribute("data-index"));
  });
  editorPanelEl.addEventListener("dragend", function(e){
    var item = e.target.closest ? e.target.closest(".setlist-track-item") : null;
    if (item) item.classList.remove("dragging");
    if (dropIndicator.parentNode) dropIndicator.parentNode.removeChild(dropIndicator);
  });
  editorPanelEl.addEventListener("dragover", function(e){
    var listEl = document.getElementById("setlist-track-list");
    if (!listEl || !listEl.contains(e.target) && e.target !== listEl) { /* still allow if inside */ }
    var types = e.dataTransfer.types;
    var hasTrack = Array.prototype.indexOf.call(types, "application/x-track-id") !== -1;
    var hasReorder = Array.prototype.indexOf.call(types, "application/x-reorder-index") !== -1;
    if (!hasTrack && !hasReorder) return;
    if (!listEl) return;
    var within = listEl.contains(e.target) || e.target === listEl;
    if (!within) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = hasReorder ? "move" : "copy";
    var dragging = listEl.querySelector(".dragging");
    var idx = getDropIndex(listEl, e.clientY, dragging);
    var items = Array.prototype.slice.call(listEl.querySelectorAll(".setlist-track-item")).filter(function(el){ return el !== dragging; });
    var ref = items[idx] || null;
    listEl.insertBefore(dropIndicator, ref);
  });
  editorPanelEl.addEventListener("drop", function(e){
    var listEl = document.getElementById("setlist-track-list");
    if (!listEl) return;
    var within = listEl.contains(e.target) || e.target === listEl;
    if (!within) return;
    e.preventDefault();
    if (dropIndicator.parentNode) dropIndicator.parentNode.removeChild(dropIndicator);
    if (!activeSetlistId) return;
    var trackId = e.dataTransfer.getData("application/x-track-id");
    var reorderIdxStr = e.dataTransfer.getData("application/x-reorder-index");
    var dragging = listEl.querySelector(".dragging");
    var idx = getDropIndex(listEl, e.clientY, dragging);
    if (trackId){
      mutateSetlist(activeSetlistId, function(ids){ ids.splice(idx, 0, trackId); return ids; });
    } else if (reorderIdxStr !== ""){
      var fromIdx = parseInt(reorderIdxStr, 10);
      mutateSetlist(activeSetlistId, function(ids){
        var copy = ids.slice();
        var moved = copy.splice(fromIdx, 1)[0];
        var insertAt = idx;
        if (fromIdx < idx) insertAt -= 1;
        copy.splice(insertAt, 0, moved);
        return copy;
      });
    }
  });

  // library drag source
  document.getElementById("panel-library").addEventListener("dragstart", function(e){
    var item = e.target.closest ? e.target.closest(".track-item") : null;
    if (!item) return;
    item.classList.add("dragging");
    e.dataTransfer.effectAllowed = "copy";
    e.dataTransfer.setData("application/x-track-id", item.getAttribute("data-track-id"));
  });
  document.getElementById("panel-library").addEventListener("dragend", function(e){
    var item = e.target.closest ? e.target.closest(".track-item") : null;
    if (item) item.classList.remove("dragging");
  });

  // ---------- event delegation: library panel ----------
  var libraryPanel = document.getElementById("panel-library");
  libraryPanel.addEventListener("click", function(e){
    var addBtn = e.target.closest && e.target.closest('[data-action="quick-add"]');
    if (addBtn){
      if (!activeSetlistId){ showBanner("Selecteer eerst een setlist rechts, of maak er een aan.", "warn"); return; }
      mutateSetlist(activeSetlistId, function(ids){ ids.push(addBtn.getAttribute("data-id")); return ids; });
      return;
    }
    var editBtn = e.target.closest && e.target.closest('[data-action="edit-track"]');
    if (editBtn){
      editingTrackId = editBtn.getAttribute("data-id");
      renderLibrary();
      return;
    }
    var cancelEditBtn = e.target.closest && e.target.closest('[data-action="cancel-track-edit"]');
    if (cancelEditBtn){
      editingTrackId = null;
      renderLibrary();
      return;
    }
    var saveEditBtn = e.target.closest && e.target.closest('[data-action="save-track-edit"]');
    if (saveEditBtn){
      var editId = saveEditBtn.getAttribute("data-id");
      commitTrackEdit(editId);
      return;
    }
    var delBtn = e.target.closest && e.target.closest('[data-action="delete-track"]');
    if (delBtn){
      var id = delBtn.getAttribute("data-id");
      var key = "track:" + id;
      if (requestConfirm(key, renderLibrary)) deleteTrackById(id);
      return;
    }
    if (e.target.id === "upload-btn" || (e.target.closest && e.target.closest("#upload-btn"))){
      document.getElementById("file-input").click();
    }
  });
  function commitTrackEdit(id){
    var titleInput = document.getElementById("edit-title-" + id);
    var artistInput = document.getElementById("edit-artist-" + id);
    var durInput = document.getElementById("edit-duration-" + id);
    if (!titleInput || !durInput) return;
    var title = titleInput.value.trim();
    var artist = artistInput ? artistInput.value.trim() : "";
    var dur = parseDuration(durInput.value);
    if (!title){ showBanner("Vul een titel in.", "warn"); titleInput.focus(); return; }
    if (dur == null){ showBanner("Gebruik het formaat mm:ss, bijvoorbeeld 3:45.", "warn"); durInput.focus(); return; }
    editingTrackId = null;
    updateTrack(id, title, artist, dur);
    renderLibrary();
  }
  libraryPanel.addEventListener("keydown", function(e){
    var isEditField = e.target.classList && (e.target.classList.contains("track-edit-title") || e.target.classList.contains("track-edit-artist") || e.target.classList.contains("track-edit-duration"));
    if (!isEditField) return;
    if (e.key === "Enter"){
      e.preventDefault();
      var id = e.target.id.replace(/^edit-(title|artist|duration)-/, "");
      commitTrackEdit(id);
    } else if (e.key === "Escape"){
      editingTrackId = null;
      renderLibrary();
    }
  });
  libraryPanel.addEventListener("input", function(e){
    if (e.target.id === "library-search"){
      librarySearchTerm = e.target.value;
      renderLibrary();
    }
  });
  libraryPanel.addEventListener("submit", function(e){
    if (e.target.id === "add-track-form"){
      e.preventDefault();
      var titleInput = document.getElementById("new-track-title");
      var artistInput = document.getElementById("new-track-artist");
      var durInput = document.getElementById("new-track-duration");
      var errorEl = document.getElementById("add-track-error");
      var title = titleInput.value.trim();
      var artist = artistInput.value.trim();
      var dur = parseDuration(durInput.value);
      if (!title){ errorEl.textContent = "Vul een titel in."; errorEl.hidden = false; return; }
      if (dur == null){ errorEl.textContent = "Gebruik het formaat mm:ss, bijvoorbeeld 3:45."; errorEl.hidden = false; return; }
      errorEl.hidden = true;
      addTrack(title, artist, dur);
      titleInput.value = ""; artistInput.value = ""; durInput.value = "";
      titleInput.focus();
    }
  });
  libraryPanel.addEventListener("change", function(e){
    if (e.target.id === "file-input"){
      var file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (file) handleFileImport(file);
    }
  });

  // ---------- event delegation: setlists panel ----------
  var setlistsPanel = document.getElementById("panel-setlists");
  setlistsPanel.addEventListener("click", function(e){
    if (e.target.id === "new-setlist-btn" || (e.target.closest && e.target.closest("#new-setlist-btn"))){
      creatingSetlist = true;
      renderNewSetlistForm();
      return;
    }
    if (e.target.id === "cancel-new-setlist"){
      creatingSetlist = false;
      renderNewSetlistForm();
      return;
    }
    var renameBtn = e.target.closest && e.target.closest('[data-action="rename-setlist"]');
    if (renameBtn){
      renamingSetlistId = renameBtn.getAttribute("data-id");
      renderSetlistsList();
      return;
    }
    var cancelRenameBtn = e.target.closest && e.target.closest('[data-action="cancel-setlist-rename"]');
    if (cancelRenameBtn){
      renamingSetlistId = null;
      renderSetlistsList();
      return;
    }
    var saveRenameBtn = e.target.closest && e.target.closest('[data-action="save-setlist-rename"]');
    if (saveRenameBtn){
      commitSetlistRename(saveRenameBtn.getAttribute("data-id"));
      return;
    }
    var delBtn = e.target.closest && e.target.closest('[data-action="delete-setlist"]');
    if (delBtn){
      var id = delBtn.getAttribute("data-id");
      var key = "setlist:" + id;
      if (requestConfirm(key, renderSetlistsList)) deleteSetlist(id);
      return;
    }
    var row = e.target.closest && e.target.closest('[data-action="select-setlist"]');
    if (row){
      activeSetlistId = row.getAttribute("data-id");
      renderSetlistsList(); renderActiveSetlist();
    }
  });
  function commitSetlistRename(id){
    var input = document.getElementById("rename-setlist-" + id);
    if (!input) return;
    var name = input.value.trim();
    if (!name){ showBanner("Vul een naam in.", "warn"); input.focus(); return; }
    renamingSetlistId = null;
    renameSetlist(id, name);
    renderSetlistsList();
  }
  setlistsPanel.addEventListener("keydown", function(e){
    if (e.target.classList && e.target.classList.contains("setlist-rename-input")){
      if (e.key === "Enter"){
        e.preventDefault();
        commitSetlistRename(e.target.id.replace(/^rename-setlist-/, ""));
      } else if (e.key === "Escape"){
        renamingSetlistId = null;
        renderSetlistsList();
      }
      return;
    }
    var row = e.target.closest && e.target.closest('[data-action="select-setlist"]');
    if (row && (e.key === "Enter" || e.key === " ")){
      e.preventDefault();
      activeSetlistId = row.getAttribute("data-id");
      renderSetlistsList(); renderActiveSetlist();
    }
  });
  setlistsPanel.addEventListener("submit", function(e){
    if (e.target.id === "create-setlist-form"){
      e.preventDefault();
      var input = document.getElementById("new-setlist-name");
      var name = input.value.trim() || ("Setlist " + (setlistsMap.size + 1));
      creatingSetlist = false;
      createSetlist(name);
      renderNewSetlistForm();
    }
  });

  // ---------- event delegation: editor panel ----------
  editorPanelEl.addEventListener("click", function(e){
    var upBtn = e.target.closest && e.target.closest('[data-action="move-up"]');
    if (upBtn && !upBtn.disabled){
      var idxUp = parseInt(upBtn.getAttribute("data-index"), 10);
      mutateSetlist(activeSetlistId, function(ids){
        var copy = ids.slice();
        if (idxUp > 0){ var tmp = copy[idxUp-1]; copy[idxUp-1] = copy[idxUp]; copy[idxUp] = tmp; }
        return copy;
      });
      return;
    }
    var downBtn = e.target.closest && e.target.closest('[data-action="move-down"]');
    if (downBtn && !downBtn.disabled){
      var idxDown = parseInt(downBtn.getAttribute("data-index"), 10);
      mutateSetlist(activeSetlistId, function(ids){
        var copy = ids.slice();
        if (idxDown < copy.length-1){ var tmp2 = copy[idxDown+1]; copy[idxDown+1] = copy[idxDown]; copy[idxDown] = tmp2; }
        return copy;
      });
      return;
    }
    var rmBtn = e.target.closest && e.target.closest('[data-action="remove-track"]');
    if (rmBtn){
      var idxRm = parseInt(rmBtn.getAttribute("data-index"), 10);
      mutateSetlist(activeSetlistId, function(ids){ var copy = ids.slice(); copy.splice(idxRm,1); return copy; });
      return;
    }
    var exportBtn = e.target.closest && e.target.closest('[data-action="export-setlist"]');
    if (exportBtn && !exportBtn.disabled){
      exportSetlist(activeSetlistId, exportBtn.getAttribute("data-format"));
      return;
    }
    var delSetlistBtn = e.target.closest && e.target.closest('[data-action="delete-active-setlist"]');
    if (delSetlistBtn){
      var key = "setlist:" + activeSetlistId;
      if (requestConfirm(key, renderActiveSetlist)){
        deleteSetlist(activeSetlistId);
      } else {
        delSetlistBtn.textContent = "";
        delSetlistBtn.innerHTML = ICON_TRASH + " Zeker weten?";
      }
      return;
    }
  });
  editorPanelEl.addEventListener("focusout", function(e){
    if (e.target.id === "setlist-name-input" && activeSetlistId){
      var val = e.target.value.trim();
      var sl = setlistsMap.get(activeSetlistId);
      if (sl && val && val !== sl.name) renameSetlist(activeSetlistId, val);
      else if (sl) e.target.value = sl.name;
    }
  });
  editorPanelEl.addEventListener("keydown", function(e){
    if (e.target.id === "setlist-name-input" && e.key === "Enter"){
      e.preventDefault();
      e.target.blur();
    }
  });
  editorPanelEl.addEventListener("change", function(e){
    if (e.target.id === "setlist-add-track-select" && activeSetlistId){
      var trackId = e.target.value;
      if (!trackId) return;
      mutateSetlist(activeSetlistId, function(ids){ ids.push(trackId); return ids; });
      e.target.value = "";
    }
  });

  // ---------- resizable panels ----------
  // Columns are sized in `fr` units (proportional shares of the available
  // width), so they automatically rescale together whenever the window is
  // resized — no resize listener needed, the grid does it natively.
  // While actively dragging a handle we track the mouse 1:1 in pixels for a
  // direct feel, then convert the result back to a ratio (relative to the
  // editor panel's width, i.e. "1fr") when the drag ends, so the next
  // window resize keeps that same proportion.
  var PANEL_WIDTHS_KEY = "setlist-studio:panel-widths";
  var RESIZE_MIN_PX = 240;
  var RESIZE_MAX_PX = 1400;
  var RESIZE_MIN_FR = 0.3;
  var RESIZE_MAX_FR = 3.2;
  var STACK_BREAKPOINT = 980;

  function clampFr(v){ return Math.max(RESIZE_MIN_FR, Math.min(RESIZE_MAX_FR, v)); }
  function panelPx(el){ return el ? el.getBoundingClientRect().width : 0; }

  function savePanelWidths(fr){
    try{ window.localStorage.setItem(PANEL_WIDTHS_KEY, JSON.stringify(fr)); } catch(e){ /* ignore */ }
  }
  function loadPanelWidths(){
    try{
      var raw = window.localStorage.getItem(PANEL_WIDTHS_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (obj && typeof obj.library === "number" && typeof obj.setlists === "number") return obj;
    } catch(e){ /* ignore */ }
    return null;
  }

  function initResizers(){
    var layoutEl = document.querySelector(".layout");
    var libraryEl = document.querySelector(".panel-library");
    var setlistsEl = document.querySelector(".panel-setlists");
    var editorEl = document.getElementById("editor-panel");

    var stored = loadPanelWidths();
    if (stored){
      layoutEl.style.setProperty("--w-library", clampFr(stored.library).toFixed(3) + "fr");
      layoutEl.style.setProperty("--w-setlists", clampFr(stored.setlists).toFixed(3) + "fr");
    }

    function applyRatiosFromCurrentSizes(){
      var libPx = panelPx(libraryEl), setPx = panelPx(setlistsEl), edPx = panelPx(editorEl);
      if (edPx <= 0) return;
      var libFr = clampFr(libPx / edPx);
      var setFr = clampFr(setPx / edPx);
      layoutEl.style.setProperty("--w-library", libFr.toFixed(3) + "fr");
      layoutEl.style.setProperty("--w-setlists", setFr.toFixed(3) + "fr");
      savePanelWidths({library: libFr, setlists: setFr});
    }

    function dynamicMaxPx(targetEl, otherEl){
      var reserve = panelPx(otherEl) + 14 + 14 + 320 + 32; // other column + handles + min editor + gutters
      var avail = window.innerWidth - reserve;
      return Math.max(RESIZE_MIN_PX, Math.min(RESIZE_MAX_PX, avail));
    }

    function setupResizeHandle(handle, targetEl, otherEl){
      if (!handle) return;
      var dragging = false, startX = 0, startWidth = 0;
      handle.addEventListener("pointerdown", function(e){
        if (window.innerWidth < STACK_BREAKPOINT) return;
        dragging = true; startX = e.clientX; startWidth = panelPx(targetEl);
        try{ handle.setPointerCapture(e.pointerId); } catch(err){}
        document.body.style.userSelect = "none";
      });
      handle.addEventListener("pointermove", function(e){
        if (!dragging) return;
        var max = dynamicMaxPx(targetEl, otherEl);
        var next = Math.max(RESIZE_MIN_PX, Math.min(max, startWidth + (e.clientX - startX)));
        layoutEl.style.setProperty(targetEl === libraryEl ? "--w-library" : "--w-setlists", next + "px");
      });
      function endDrag(){
        if (!dragging) return;
        dragging = false;
        document.body.style.userSelect = "";
        applyRatiosFromCurrentSizes();
      }
      handle.addEventListener("pointerup", endDrag);
      handle.addEventListener("pointercancel", endDrag);
      handle.addEventListener("keydown", function(e){
        if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
        e.preventDefault();
        var step = 24;
        var max = dynamicMaxPx(targetEl, otherEl);
        var next = Math.max(RESIZE_MIN_PX, Math.min(max, panelPx(targetEl) + (e.key === "ArrowRight" ? step : -step)));
        layoutEl.style.setProperty(targetEl === libraryEl ? "--w-library" : "--w-setlists", next + "px");
        applyRatiosFromCurrentSizes();
      });
    }

    setupResizeHandle(document.getElementById("resize-handle-library"), libraryEl, editorEl);
    setupResizeHandle(document.getElementById("resize-handle-setlists"), setlistsEl, editorEl);
  }

  // ---------- settings panel (cloud sync) ----------
  var settingsBtn = document.getElementById("settings-btn");
  var settingsPanelEl = document.getElementById("settings-panel");
  if (settingsBtn && settingsPanelEl){
    settingsBtn.addEventListener("click", function(){
      settingsPanelEl.hidden = !settingsPanelEl.hidden;
      if (!settingsPanelEl.hidden) renderSettingsPanel();
    });
    settingsPanelEl.addEventListener("click", function(e){
      if (e.target.id === "connect-cloud-btn"){ handleConnectFirebase(); return; }
      if (e.target.id === "disconnect-cloud-btn"){ handleDisconnectFirebase(); return; }
      if (e.target.id === "reenable-cloud-btn"){ handleReenableFirebase(); return; }
    });
  }

  // ---------- boot ----------
  initResizers();
  initStore();
})();
</script>
